---
    name: "release"

    on:
      push:
        tags:
          - "*"
      workflow_dispatch:
        inputs:
          logLevel:
            description: 'Log level'
            required: true
            default: 'warning'

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

    jobs:
      flutter-test:
        runs-on: "ubuntu-24.04"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Run Flutter tests
            run: flutter test
            shell: bash

      flutter-analyze:
        runs-on: "ubuntu-24.04"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Analyze Flutter project
            run: flutter analyze
            shell: bash

      flutter-build-android:
        name: "Release for android"
        needs: [flutter-test, flutter-analyze]
        runs-on: "ubuntu-24.04"
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Extract tag name
            run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            shell: bash
          - name: Echo build progress
            run: echo "Kazumi_android_${{ env.tag }}.apk build progress"
            shell: bash
          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
            shell: bash
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Remove build id
            run: sed -i '/+/d' pubspec.yaml
            shell: bash
          - name: Build Flutter for Android
            run: >-
              flutter build apk --split-per-abi
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash
          - name: Package android build output
            run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Kazumi_android_${env:tag}.apk
            shell: bash

          - name: Upload android outputs
            uses: actions/upload-artifact@v4
            with:
              name: android_outputs
              path: Kazumi_android_*.apk

      flutter-build-windows:
        name: "Release for windows"
        runs-on: "windows-latest"
        needs: [flutter-build-android]
        permissions: write-all

        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - run: |
                  $tag = "${{ github.ref }}".Replace('refs/tags/', '')
                  echo "tag=$(echo $tag)" >> $env:GITHUB_ENV
          - run: echo "Kazumi_windows_${env:tag}.zip build progress"
          - run: choco install yq
          - name: Enable Git longpaths
            run: git config --system core.longpaths true
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Set up Java
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '18'
          - run: flutter pub get
          - run: >-
              flutter build windows
              --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
          - run: Compress-Archive build/windows/x64/runner/Release/* Kazumi_windows_${env:tag}.zip
          - name: Upload windows outputs
            uses: actions/upload-artifact@v4
            with:
              name: windows_outputs
              path: Kazumi_windows_*.zip

          # Build unsigned MSIX (this fork has no SignPath credentials,
          # packages are published unsigned, see README).
          - name: Build unsigned msix
            run: dart run msix:create
          - name: Upload windows msix ouputs
            uses: actions/upload-artifact@v4
            with:
              name: windows_msix_outputs
              path: |
                build/windows/x64/runner/Release/kazumi.msix

      release:
        name: "Release"
        runs-on: "ubuntu-24.04"
        needs: [flutter-build-windows]
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Extract tag name
            run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            shell: bash
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'
          - name: Setup Android SDK
            uses: android-actions/setup-android@v3
          - name: Setup Android build tools
            run: sdkmanager "build-tools;34.0.0"

          - name: Download windows zip build file
            uses: actions/download-artifact@v4
            with:
              name: windows_outputs
              path: windows_outputs
          - name: Copy windows build file to root
            run: cp windows_outputs/* Kazumi_windows_${{ env.tag }}.zip

          - name: Download windows msix build file
            uses: actions/download-artifact@v4
            with:
              name: windows_msix_outputs
              path: windows_msix_outputs
          - name: Copy windows msix build file to root
            run: cp windows_msix_outputs/kazumi.msix Kazumi_windows_${{ env.tag }}.msix

          - name: Download android build file
            uses: actions/download-artifact@v4
            with:
              name: android_outputs
              path: android_outputs
          - name: Copy android build file to unsigned floder
            run: |
              mkdir build
              mkdir build/unsigned
              mkdir build/signed
              cp android_outputs/* build/unsigned/

          # APK signing is optional: sign when SIGNING_KEY_BASE64 is configured,
          # otherwise publish the debug-signed build output as is.
          - name: Detect signing secrets
            id: has_signing
            env:
              SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
            run: |
              if [ -n "$SIGNING_KEY_BASE64" ]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
              fi
            shell: bash

          - name: Sign APK
            id: sign_app
            if: steps.has_signing.outputs.enabled == 'true'
            uses: filippoLeporati93/android-release-signer@v1
            with:
              releaseDirectory: build/unsigned
              signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
              alias: ${{ secrets.KEY_ALIAS }}
              keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
            env:
              BUILD_TOOLS_VERSION: "34.0.0"

          - name: Copy android release file
            run: |
              if [ "${{ steps.has_signing.outputs.enabled }}" == "true" ] && [ -n "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
                cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "Kazumi_android_${{ env.tag }}.apk"
              else
                cp build/unsigned/Kazumi_android_*.apk "Kazumi_android_${{ env.tag }}.apk"
              fi
            shell: bash

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              files: |
                Kazumi_android_${{ env.tag }}.apk
                Kazumi_windows_${{ env.tag }}.zip
                Kazumi_windows_${{ env.tag }}.msix
